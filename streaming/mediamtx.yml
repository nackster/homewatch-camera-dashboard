logLevel: info
api: true
apiAddress: :9997
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ["127.0.0.1", "::1", "172.16.0.0/12"]
    permissions:
      - action: api
rtsp: false
rtmp: false
srt: false
webrtc: false
hls: true
hlsAddress: :8888
hlsAlwaysRemux: false
hlsVariant: fmp4

pathDefaults:
  sourceOnDemand: true
  sourceOnDemandStartTimeout: 15s
  sourceOnDemandCloseAfter: 15s
  rtspTransport: tcp

paths:
  cam1:
    source: publisher
  cam2:
    source: publisher
  cam3:
    source: publisher
  cam4:
    source: publisher
